site_name: act for Mere Mortals
site_description: Run your GitHub Actions workflows on your own machine before you push. How act reads a workflow, shows you the plan, and runs each job in a Docker container that stands in for a GitHub runner, with the gaps between the stand-in and the real thing stated plainly.
