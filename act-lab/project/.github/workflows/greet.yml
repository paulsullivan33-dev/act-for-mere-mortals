name: Greet

on:
  workflow_dispatch:
    inputs:
      name:
        description: Who to greet
        required: true
        default: world

jobs:
  greet:
    runs-on: ubuntu-latest
    steps:
      - name: Say hello
        run: echo "Hello, ${{ inputs.name }}!"
      - name: Show the event name
        run: echo "This run was triggered by ${{ github.event_name }}"
